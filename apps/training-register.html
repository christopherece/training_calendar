<title>Training Register</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a harbour chart. Ruler-ticked header, role-aware tab bar, tables and a staff-by-course matrix as the working surfaces. */
:root {
  --bg: #EDF3F3; --surface: #FFFFFF; --surface-2: #E3ECEC; --ink: #0D2230; --muted: #546B7A; --line: #CEDADB;
  --accent: #0E7C7B; --accent-ink: #FFFFFF; --accent-soft: #D3EBEA;
  --ok-bg: #D8EFE6; --ok-fg: #0F6B4F;
  --t90-bg: #F4EBC4; --t90-fg: #6B5400;
  --t60-bg: #FBDFC2; --t60-fg: #8F4300;
  --t30-bg: #F6D2CC; --t30-fg: #9E2D22;
  --exp-bg: #8F1D2C; --exp-fg: #FFFFFF;
  --c-maritime: #2563B0; --c-radio: #6D4AC4; --c-env: #5F7F1F; --c-mach: #A86B00; --c-aid: #C23B2E; --c-other: #5B7080;
  --font-display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --font-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09181D; --surface: #0F262C; --surface-2: #163640; --ink: #E5F0F0; --muted: #8DA8AE; --line: #234650;
    --accent: #4FD1C5; --accent-ink: #052B2A; --accent-soft: #11403F;
    --ok-bg: #123A30; --ok-fg: #5ADBB0; --t90-bg: #3D3410; --t90-fg: #F0D56B; --t60-bg: #4A2A10; --t60-fg: #FFB56B;
    --t30-bg: #4A1D18; --t30-fg: #FF9C8E; --exp-bg: #C23A49; --exp-fg: #FFFFFF;
    --c-maritime: #7DB0F2; --c-radio: #AB92FF; --c-env: #A9CB54; --c-mach: #E3A93F; --c-aid: #FF8678; --c-other: #9DB3C0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09181D; --surface: #0F262C; --surface-2: #163640; --ink: #E5F0F0; --muted: #8DA8AE; --line: #234650;
  --accent: #4FD1C5; --accent-ink: #052B2A; --accent-soft: #11403F;
  --ok-bg: #123A30; --ok-fg: #5ADBB0; --t90-bg: #3D3410; --t90-fg: #F0D56B; --t60-bg: #4A2A10; --t60-fg: #FFB56B;
  --t30-bg: #4A1D18; --t30-fg: #FF9C8E; --exp-bg: #C23A49; --exp-fg: #FFFFFF;
  --c-maritime: #7DB0F2; --c-radio: #AB92FF; --c-env: #A9CB54; --c-mach: #E3A93F; --c-aid: #FF8678; --c-other: #9DB3C0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.page { max-width: 1180px; margin: 0 auto; padding-block: 22px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header + nav */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
h1 { margin: 0; font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: clamp(28px, 6vw, 44px); line-height: 1; letter-spacing: -0.01em; }
.sub { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.who-name { font-weight: 600; }
.ruler { height: 12px; margin-top: 16px; border-bottom: 1px solid var(--ink);
  background: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 40px) left bottom / 100% 12px no-repeat,
              repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 8px) left bottom / 100% 6px no-repeat; }
.nav { display: flex; gap: 2px; overflow-x: auto; margin-top: 12px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 14px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }
.badge { font: 500 11px var(--font-mono); background: var(--exp-bg); color: var(--exp-fg); border-radius: 999px; padding: 0 7px; line-height: 18px; }
#view { margin-top: 18px; display: grid; gap: 18px; }

/* Controls */
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 7px 14px; min-height: 38px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--exp-bg); border-color: var(--exp-bg); color: var(--exp-fg); }
.btn.quiet { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.linkbtn { background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkbtn:hover { text-decoration-color: var(--accent); color: var(--accent); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.row.between { justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sw { width: 9px; height: 9px; border-radius: 2px; background: var(--cat, var(--muted)); display: inline-block; flex: none; }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.accent { border-color: var(--accent); color: var(--accent); }
.tag.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Panels, notes */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.panel h2, .sec-h { margin: 0 0 10px; font-family: var(--font-display); font-stretch: 108%; font-size: 18px; font-weight: 700; }
.note { padding: 12px 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.note.alert { border-color: var(--t30-fg); background: var(--t30-bg); color: var(--t30-fg); }
.empty { padding: 22px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; display: grid; gap: 10px; justify-items: start; }
.empty h2 { margin: 0; font-family: var(--font-display); font-stretch: 112%; font-size: 22px; }
.empty p { margin: 0; max-width: 60ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 960px) { .cols { grid-template-columns: minmax(0, 1fr); } }

/* Status pills / cells */
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.st-current { background: var(--ok-bg); color: var(--ok-fg); }
.st-90 { background: var(--t90-bg); color: var(--t90-fg); }
.st-60 { background: var(--t60-bg); color: var(--t60-fg); }
.st-30 { background: var(--t30-bg); color: var(--t30-fg); }
.st-exp { background: var(--exp-bg); color: var(--exp-fg); }
.st-prog { background: var(--accent-soft); color: var(--accent); }
.st-sched { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.st-miss { background: transparent; color: var(--t30-fg); box-shadow: inset 0 0 0 1px var(--t30-fg); }
.st-na { background: transparent; color: var(--muted); }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tile { appearance: none; border: 0; text-align: left; background: var(--surface); padding: 14px 16px; cursor: pointer; display: grid; gap: 2px; }
.tile:hover { background: var(--accent-soft); }
.tile[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.tile b { font: 500 34px/1.05 var(--font-mono); }
.tile span { font-size: 13px; color: var(--muted); }
.tile.static { cursor: default; } .tile.static:hover { background: var(--surface); }
.t-exp b { color: var(--exp-bg); } .t-30 b { color: var(--t30-fg); } .t-60 b { color: var(--t60-fg); } .t-90 b { color: var(--t90-fg); } .t-miss b { color: var(--t30-fg); } .t-ok b { color: var(--ok-fg); }
:root[data-theme="dark"] .t-exp b { color: var(--t30-fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .t-exp b { color: var(--t30-fg); } }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; white-space: nowrap; background: var(--surface); border-bottom: 1px solid var(--line); }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
tbody tr:first-child td { border-top: 0; }
td.num, th.num { text-align: right; font-family: var(--font-mono); }
td .sub2 { display: block; font-size: 12.5px; color: var(--muted); }
.cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.bar { height: 8px; min-width: 70px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok-fg); }
.bar.warn i { background: var(--t60-fg); } .bar.low i { background: var(--t30-fg); }
.pctcell { display: flex; align-items: center; gap: 10px; min-width: 140px; }
.pctcell .bar { flex: 1; }
.pctcell b { font: 500 13px var(--font-mono); min-width: 38px; text-align: right; }

/* Matrix */
.mx { border-collapse: separate; border-spacing: 0; width: auto; }
.mx th, .mx td { border: 0; padding: 0; }
.mx thead th { vertical-align: bottom; padding: 8px 4px; text-transform: none; letter-spacing: 0; font: 500 12px var(--font-body); color: var(--ink); width: 92px; min-width: 92px; text-align: left; white-space: normal; }
.mx thead th .sw { margin-bottom: 4px; display: block; width: 100%; height: 3px; border-radius: 0; }
.mx .rowh { position: sticky; left: 0; z-index: 2; background: var(--surface); min-width: 170px; max-width: 170px; padding: 6px 12px; text-align: left; border-right: 1px solid var(--line); }
.mx thead .rowh { z-index: 3; }
.mx tbody td { padding: 3px; border-top: 1px solid var(--line); }
.mx tbody tr:first-child td, .mx tbody tr:first-child th { border-top: 0; }
.mx tbody th.rowh { border-top: 1px solid var(--line); font: 600 13px var(--font-body); text-transform: none; letter-spacing: 0; color: var(--ink); }
.mx tbody tr:first-child th.rowh { border-top: 0; }
.mc { appearance: none; border: 0; width: 100%; min-height: 46px; border-radius: 4px; display: grid; place-items: center; gap: 0; padding: 3px; font-weight: 600; font-size: 14px; line-height: 1.15; cursor: pointer; }
.mc small { font: 400 10px var(--font-mono); opacity: .9; }
.mc:hover { filter: brightness(.95); }
.mc.static { cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend span.pill { font-size: 11.5px; padding: 1px 8px; }

/* Calendar */
.cal-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.month-label { margin: 0; font-family: var(--font-display); font-stretch: 112%; font-weight: 700; font-size: 24px; }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow span { font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 6px; }
.grid { gap: 1px; background: var(--line); border: 1px solid var(--line); }
.cell { appearance: none; border: 0; margin: 0; text-align: left; background: var(--surface); padding: 6px; min-height: 100px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; position: relative; }
.cell:hover { background: var(--accent-soft); }
.cell.out { background: var(--surface-2); color: var(--muted); }
.cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
.num2 { appearance: none; border: 0; background: none; padding: 0; color: inherit; cursor: pointer; font: 500 13px var(--font-mono); align-self: flex-start; }
.cell.today .num2 { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; }
.evs { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ev { display: block; min-width: 0; font-size: 11px; line-height: 1.35; padding: 2px 5px; border-radius: 3px; background: var(--surface-2); background: color-mix(in srgb, var(--evc) 16%, var(--surface)); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ev-sched { --evc: var(--accent); } .ev-done { --evc: var(--ok-fg); } .ev-exp { --evc: var(--t30-fg); } .ev-plan { --evc: var(--c-radio); }
.ev.done { text-decoration: line-through; opacity: .7; }
.ev[draggable="true"], .evrow[draggable="true"] { cursor: grab; }
.cell.drop, .ycard.drop, .yr-strip.drop { background: var(--accent-soft); outline: 2px dashed var(--accent); outline-offset: -2px; }
.ycards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.ycard { display: grid; gap: 8px; align-content: start; }
.ycard .ev { white-space: normal; }
.plan-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; }
.more { font-size: 11px; color: var(--muted); padding-left: 5px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--evc); }
@media (max-width: 640px) { .evs { display: none; } .dots { display: flex; } .cell { min-height: 58px; padding: 4px; } .dow span { padding-inline: 2px; text-align: center; } }
.evrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.evrow:first-of-type { border-top: 0; }
.evrow .ico { font-family: var(--font-mono); font-weight: 500; color: var(--evc); width: 1.4em; }
.evrow .grow { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }

/* Profile */
.p-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; align-items: flex-start; }
.p-name { margin: 0; font-family: var(--font-display); font-stretch: 118%; font-weight: 800; font-size: clamp(24px, 4vw, 32px); line-height: 1.1; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 20px; margin-top: 14px; }
.kv div { min-width: 0; } .kv dt { font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); } .kv dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.doclist { list-style: none; margin: 0; padding: 0; display: grid; }
.doclist li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.doclist li:first-child { border-top: 0; }
.doclist .grow { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
.doclist a { color: var(--accent); font-weight: 600; }
.confirm { padding: 10px 12px; background: var(--t30-bg); color: var(--t30-fg); border-radius: 5px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13.5px; }
.confirm p { margin: 0; flex: 1 1 220px; }

/* Reminders */
.rem { display: grid; gap: 0; }
.rem-person { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.rem-person:first-child { border-top: 0; }
.rem-item { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 14px; }
.rem-item .grow { flex: 1 1 220px; min-width: 0; }

/* Forms + modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(4, 14, 18, .62); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: 100%; max-width: 600px; margin-block: 3vh; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
.modal.wide { max-width: 780px; }
.modal-title { margin: 0 0 14px; font-family: var(--font-display); font-stretch: 112%; font-size: 22px; font-weight: 700; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.span2 { grid-column: 1 / -1; }
@media (max-width: 560px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-weight: 600; font-size: 13px; }
.field small { font-size: 12.5px; color: var(--muted); }
.field input:not([type="checkbox"]):not([type="radio"]), .field select, .field textarea, .tb input, .tb select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; min-height: 38px; }
.field textarea { min-height: 76px; resize: vertical; }
.field.check { flex-direction: row; align-items: center; gap: 10px; }
.field.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 12px; padding: 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); max-height: 200px; overflow-y: auto; }
.checks label { display: flex; align-items: flex-start; gap: 8px; font-weight: 500; font-size: 13.5px; }
.checks input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.form-error { margin: 12px 0 0; min-height: 1.4em; color: var(--t30-fg); font-weight: 600; font-size: 14px; }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.results { display: grid; gap: 4px; margin-top: 6px; }
.results button { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; cursor: pointer; font-weight: 600; }
.results button:hover { border-color: var(--accent); }
.tb { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tb input[type="search"] { width: 240px; max-width: 100%; }
.tb select { width: auto; min-width: 160px; }
.tb label.inl { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
textarea.copybox { width: 100%; min-height: 220px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 10px; font: 13px/1.5 var(--font-mono); }

.toast { position: fixed; z-index: 60; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .18s, transform .18s; }
.toast.show { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="page">
  <header class="top">
    <div>
      <h1>Training Register</h1>
      <p class="sub">Staff certifications, courses and compliance records for the marina.</p>
    </div>
    <div class="who" id="who"></div>
  </header>
  <div class="ruler" aria-hidden="true"></div>
  <nav class="nav" id="nav" role="tablist" aria-label="Sections"></nav>
  <main id="view"></main>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

        h('div', { class: 'field check span2' }, active, h('label', { for: 'c-active' }, 'Active (untick to archive)')),
        fld('c-notes', 'Notes', notes, null, 'span2')),
      roles, err, h('div', { class: 'modal-actions', style: { justifyContent: 'space-between' } }, del, h('span', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: closeModal }, 'Cancel'), saveBtn)));
    form.addEventListener('submit', async e => {
      e.preventDefault(); err.textContent = '';
      if (!title.value.trim()) return fail('Give the course a title.', title);
      const vm = valid.value === '' ? 0 : parseInt(valid.value, 10);
      if (!Number.isInteger(vm) || vm < 0 || vm > 240) return fail('Validity must be a whole number of months from 0 to 240.', valid);
      const data = { title: title.value.trim(), category: cat.value, validity: vm, provider: prov.value.trim(), required: req.checked,
        appliesTo: applies.value.split(',').map(x => x.trim()).filter(Boolean), active: active.checked, notes: notes.value.trim() };
      if (edit && c.example) data.example = true;
      const id = edit ? c.id : 'c_' + rid();
      saveBtn.disabled = true;
      try { await state.db.doc('courses/' + id).set(data); toast(edit ? 'Course saved.' : 'Course added.'); closeModal(); render(); }
      catch (ex) { saveBtn.disabled = false; fail('Could not save. Only managers can change courses.'); }
    });
    openModal(edit ? 'Edit course' : 'Add a course', form, {});
  }

  /* ---------- records ---------- */
  function openRecords(pid, courseId) {
    const st = state.D.smap.get(pid), c = state.D.cmap.get(courseId);
    if (!st || !c) return;
    if (!state.me.admin) return;
    const recs = recsOf(pid).filter(r => r.courseId === courseId).sort((a, b) => (b.completedOn || b.scheduledFor || '').localeCompare(a.completedOn || a.scheduledFor || ''));
    const cs = cellState(st, c, recsOf(pid), state.D.today);
    const list = h('div', null);
    if (!recs.length) list.append(h('p', { class: 'muted' }, 'No records for this course yet.'));
    recs.forEach(r => list.append(h('div', { class: 'evrow' },
      h('span', { class: 'grow' }, h('b', null, STATUS_LABEL[r.status]), h('span', { class: 'sub2' }, r.status === 'completed' ? 'Completed ' + fd(r.completedOn) + (r.expiresOn ? ', expires ' + fd(r.expiresOn) : ', no expiry') : (r.scheduledFor ? 'Date ' + fd(r.scheduledFor) : 'No date') + (r.certNo ? '' : ''), r.certNo ? ' · No. ' + r.certNo : '')),
      h('button', { class: 'btn small', type: 'button', onclick: () => openRecordEditor(pid, r, courseId) }, 'Edit'))));
    openModal(staffName(st) + ' · ' + c.title, h('div', null,
      h('div', { class: 'row', style: { marginBottom: '8px' } }, statusPill(cs), h('span', { class: 'muted' }, dueText(cs))), list,
      h('div', { class: 'modal-actions' }, h('button', { class: 'btn', type: 'button', onclick: closeModal }, 'Close'), h('button', { class: 'btn primary', type: 'button', onclick: () => openRecordEditor(pid, null, courseId) }, 'Add record'))), {});
  }

  function openRecordEditor(pid, rec, courseId) {
    if (!state.db) return;
    const st = state.D.smap.get(pid); if (!st) return;
    const edit = !!rec, today = state.D.today;
    const courseList = state.courses.filter(c => c.active || (rec && c.id === rec.courseId));
    if (!courseList.length) return toast('Add a course first.');
    const v = rec || { courseId: courseId || courseList[0].id, status: 'completed', completedOn: today, scheduledFor: '', expiresOn: '', certNo: '', notes: '' };
    const err = h('p', { class: 'form-error', role: 'alert' });
    const fail = (m, el) => { err.textContent = m; if (el) el.focus(); return false; };
    const course = h('select', { id: 'r-course' }, optionsOf(courseList.map(c => [c.id, c.title]), v.courseId));
    const status = h('select', { id: 'r-status' }, optionsOf(Object.keys(STATUS_LABEL).map(k => [k, STATUS_LABEL[k]]), v.status));
    const comp = h('input', { id: 'r-comp', type: 'date', value: v.completedOn });
    const sched = h('input', { id: 'r-sched', type: 'date', value: v.scheduledFor });
    const exp = h('input', { id: 'r-exp', type: 'date', value: v.expiresOn });
    const cert = h('input', { id: 'r-cert', type: 'text', maxlength: '60', value: v.certNo, autocomplete: 'off' });
    const notes = h('textarea', { id: 'r-notes', maxlength: '400' }, v.notes);
    const compF = fld('r-comp', 'Completed on', comp), schedF = fld('r-sched', 'Date', sched, 'When it is booked or started.');
    const expF = fld('r-exp', 'Certificate expires on', exp, 'Leave empty if it never expires.');
    const recalc = h('button', { class: 'btn quiet small', type: 'button', style: { alignSelf: 'flex-start' } }, 'Work out from course validity');
    expF.append(recalc);
    let touched = !!(rec && rec.expiresOn);
    const curCourse = () => state.D.cmap.get(course.value);
    function auto() {
      if (touched) return;
      const c = curCourse();
      exp.value = status.value === 'completed' && comp.value && c && c.validity > 0 ? addMonths(comp.value, c.validity) : '';
    }
    function vis() { compF.hidden = status.value !== 'completed'; expF.hidden = status.value !== 'completed'; schedF.hidden = status.value === 'completed'; }
    exp.addEventListener('input', () => { touched = true; });
    recalc.addEventListener('click', () => { touched = false; auto(); });
    comp.addEventListener('change', auto); course.addEventListener('change', auto);
    status.addEventListener('change', () => { vis(); auto(); });
    if (!edit) auto();
    vis();

    const kindSel = h('select', { id: 'r-kind' }, optionsOf(Object.keys(DOC_KINDS).map(k => [k, DOC_KINDS[k]]), 'certificate'));
    const file = h('input', { id: 'r-file', type: 'file', multiple: true, accept: '.pdf,image/*,.txt,.csv,.md' });
    const removed = new Set();
    const existing = docsOf(pid).filter(d => rec && d.recordId === rec.id);
    const docBox = h('ul', { class: 'doclist span2' });
    function drawDocs() {
      docBox.replaceChildren(...existing.filter(d => !removed.has(d.id)).map(d => h('li', null,
        h('span', { class: 'grow' }, h('a', { href: '/_blob/' + d.id, target: '_blank', rel: 'noopener' }, d.name), h('span', { class: 'sub2 muted', style: { display: 'block', fontSize: '12.5px' } }, DOC_KINDS[d.kind])),
        h('button', { class: 'btn quiet small', type: 'button', onclick: () => { removed.add(d.id); drawDocs(); } }, 'Remove'))));
    }
    drawDocs();
    const attach = state.assets ? h('div', { class: 'form-grid span2' },
      h('div', { class: 'field span2' }, h('span', { class: 'lbl' }, 'Attached files'), docBox, !existing.length && h('small', null, 'No files attached yet.')),
      fld('r-kind', 'New file type', kindSel), fld('r-file', 'Attach certificate or card', file, 'PDF, images or text. Up to 20 MB each.')) : h('p', { class: 'muted span2' }, 'File uploads are not available in this view.');

    const saveBtn = h('button', { class: 'btn primary', type: 'submit' }, edit ? 'Save record' : 'Add record');
    const del = h('div');
    if (edit) {
      const delBtn = h('button', { class: 'btn quiet', type: 'button', onclick: () => {
        del.replaceChildren(h('div', { class: 'confirm' }, h('p', null, 'Delete this record? Attached files are kept on the profile.'),
          h('button', { class: 'btn danger small', type: 'button', onclick: async () => { try { await saveTraining(pid, cur => { delete cur.records[rec.id]; cur.docs.forEach(d => { if (d.recordId === rec.id) d.recordId = ''; }); }); closeModal(); toast('Record deleted.'); } catch (e) { fail('Could not delete the record.'); } } }, 'Delete record'),
          h('button', { class: 'btn small', type: 'button', onclick: () => del.replaceChildren(delBtn) }, 'Keep'))); } }, 'Delete record');
      del.append(delBtn);
    }
    const form = h('form', { novalidate: true },
      h('p', { class: 'muted', style: { margin: '-6px 0 12px' } }, staffName(st)),
      h('div', { class: 'form-grid' }, fld('r-course', 'Course', course, null, 'span2'), fld('r-status', 'Status', status), compF, schedF, expF, fld('r-cert', 'Certificate or card number', cert), fld('r-notes', 'Notes', notes, null, 'span2'), attach),
      err, h('div', { class: 'modal-actions', style: { justifyContent: 'space-between' } }, del, h('span', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: closeModal }, 'Cancel'), saveBtn)));
    form.addEventListener('submit', async e => {
      e.preventDefault(); err.textContent = '';
      const stv = status.value;
      if (stv === 'completed' && !comp.value) return fail('Enter the date it was completed.', comp);
      if (stv !== 'completed' && !sched.value) return fail('Enter a date for the booking.', sched);
      if (stv === 'completed' && exp.value && exp.value < comp.value) return fail('The expiry date cannot be before the completion date.', exp);
      const files = state.assets && file.files ? [...file.files] : [];
      for (const f of files) if (f.size > 20 * 1024 * 1024) return fail(f.name + ' is over 20 MB.', file);
      saveBtn.disabled = true;
      try {
        const added = [];
        for (const f of files) { const r = await state.assets.upload(f); added.push({ id: r.id, name: f.name.slice(0, 160), kind: kindSel.value, size: f.size, addedOn: today }); }
        const id = edit ? rec.id : rid();
        await saveTraining(pid, cur => {
          const old = cur.records[id] || {};
          const next = Object.assign({}, old, { courseId: course.value, status: stv, completedOn: stv === 'completed' ? comp.value : '', scheduledFor: stv === 'completed' ? '' : sched.value,
            expiresOn: stv === 'completed' ? exp.value : '', certNo: cert.value.trim(), notes: notes.value.trim() });
          if (old.expiresOn !== next.expiresOn) delete next.reminders;
          cur.records[id] = next;
          cur.docs = cur.docs.filter(d => !removed.has(d.id));
          added.forEach(d => cur.docs.push(Object.assign({}, d, { recordId: id })));
        });
        if (state.assets) for (const dId of removed) { try { await state.assets.delete(dId); } catch (x) { /* ignore */ } }
        toast(edit ? 'Record saved.' : 'Record added.'); closeModal(); render();
      } catch (ex) { saveBtn.disabled = false; fail('Could not save. Check your connection and that you are a manager, then try again.'); }
    });
    openModal(edit ? 'Edit record' : 'Add a record', form, { wide: true });
  }

  function openUploadModal(pid) {
    if (!state.assets) return toast('File uploads are not available in this view.');
    const recs = recsOf(pid), err = h('p', { class: 'form-error', role: 'alert' });
    const fail = (m, el) => { err.textContent = m; if (el) el.focus(); return false; };
    const file = h('input', { id: 'u-file', type: 'file', multiple: true, accept: '.pdf,image/*,.txt,.csv,.md' });
    const kind = h('select', { id: 'u-kind' }, optionsOf(Object.keys(DOC_KINDS).map(k => [k, DOC_KINDS[k]]), 'certificate'));
    const link = h('select', { id: 'u-link' }, h('option', { value: '' }, 'Not linked to a record'),
      recs.slice().sort((a, b) => (b.completedOn || b.scheduledFor || '').localeCompare(a.completedOn || a.scheduledFor || '')).map(r => { const c = state.D.cmap.get(r.courseId); return h('option', { value: r.id }, (c ? c.title : 'Removed course') + ' · ' + STATUS_LABEL[r.status] + ' ' + fd(r.completedOn || r.scheduledFor)); }));
    const saveBtn = h('button', { class: 'btn primary', type: 'submit' }, 'Upload');
    const form = h('form', { novalidate: true }, h('div', { class: 'form-grid' },
      fld('u-file', 'Files', file, 'Certificates, completion cards or training materials. PDF, images or text. Up to 20 MB each.', 'span2'), fld('u-kind', 'Type', kind), fld('u-link', 'Attach to record', link)),
      err, h('div', { class: 'modal-actions' }, h('button', { class: 'btn', type: 'button', onclick: closeModal }, 'Cancel'), saveBtn));
    form.addEventListener('submit', async e => {
      e.preventDefault(); err.textContent = '';
      const files = [...(file.files || [])];
      if (!files.length) return fail('Choose at least one file.', file);
      for (const f of files) if (f.size > 20 * 1024 * 1024) return fail(f.name + ' is over 20 MB.', file);
      saveBtn.disabled = true;
      try {
        const added = [];
        for (const f of files) { const r = await state.assets.upload(f); added.push({ id: r.id, name: f.name.slice(0, 160), kind: kind.value, size: f.size, addedOn: state.D.today, recordId: link.value }); }
        await saveTraining(pid, cur => { added.forEach(d => cur.docs.push(d)); });
        toast(added.length === 1 ? 'File uploaded.' : added.length + ' files uploaded.'); closeModal(); render();
      } catch (ex) { saveBtn.disabled = false; fail('Could not upload. Check the file type and your connection, then try again.'); }
    });
    openModal('Upload documents', form, {});
  }

  /* ---------- example data ---------- */
  async function addExamples() {
    const T = todayYmd();
    const V = { lifejacket: 36, vhf: 0, spill: 24, hazsub: 60, travelift: 36, forklift: 60, firstaid: 24, firewarden: 12 };
    const courses = [
      ['lifejacket', 'Maritime safety and sea survival', 'maritime', [], 'Approved provider'],
      ['vhf', 'VHF marine radio operator', 'radio', ['Harbour master', 'Marina supervisor', 'Dock hand'], 'Maritime radio course'],
      ['spill', 'Oil and fuel spill response', 'environment', ['Dock hand', 'Maintenance technician', 'Marina supervisor'], 'Environmental provider'],
      ['hazsub', 'Hazardous substances handling', 'environment', ['Maintenance technician', 'Dock hand'], 'Approved provider'],
      ['travelift', 'Travelift and hardstand operation', 'machinery', ['Maintenance technician', 'Marina supervisor'], 'Equipment supplier'],
      ['forklift', 'Forklift operation', 'machinery', ['Maintenance technician'], 'Licensed trainer'],
      ['firstaid', 'Workplace first aid', 'firstaid', [], 'First aid provider'],
      ['firewarden', 'Fire warden and evacuation', 'other', ['Harbour master', 'Marina supervisor'], 'Fire safety provider']
    ];
    const people = [
      ['aroha', 'Aroha Tane', 'Harbour master', 'Operations', '021 555 0101', { lifejacket: 300, vhf: -500, spill: 200, firstaid: 20, firewarden: 45 }, {}],
      ['liam', "Liam O'Brien", 'Marina supervisor', 'Operations', '021 555 0102', { lifejacket: 80, vhf: -300, spill: -12, travelift: 500, firstaid: 400, firewarden: 8 }, { spill: ['scheduled', 9] }],
      ['sione', 'Sione Faleolo', 'Dock hand', 'Dock team', '021 555 0103', { lifejacket: 610, spill: 70, hazsub: 900, firstaid: -40 }, { vhf: ['in_progress', -3] }],
      ['mia', 'Mia Chen', 'Dock hand', 'Dock team', '021 555 0104', { lifejacket: 25, vhf: -200, spill: 300, hazsub: 55, firstaid: 100 }, {}],
      ['jack', 'Jack Rowe', 'Maintenance technician', 'Maintenance', '021 555 0105', { lifejacket: 700, spill: 40, hazsub: 1000, travelift: 15, forklift: 400, firstaid: 250 }, {}],
      ['hemi', 'Hemi Walker', 'Maintenance technician', 'Maintenance', '021 555 0106', { lifejacket: -5, spill: 500, firstaid: 600 }, { travelift: ['scheduled', 14], forklift: ['in_progress', -2] }],
      ['priya', 'Priya Nair', 'Marina administrator', 'Office', '021 555 0107', { lifejacket: 300, firstaid: 55 }, {}],
      ['tom', 'Tom Baker', 'Dock hand', 'Dock team', '021 555 0108', {}, { lifejacket: ['scheduled', 6] }]
    ];
    try {
      for (const c of courses) await state.db.doc('courses/ex_' + c[0]).set({ title: c[1], category: c[2], validity: V[c[0]], provider: c[4], required: true, appliesTo: c[3], active: true, notes: '', example: true });
      let n = 1;
      for (const p of people) {
        await state.db.doc('staff/m_ex_' + p[0]).set({ name: p[1], role: p[2], department: p[3], phone: p[4], email: p[0] + '@example.com', startDate: '', active: true, assigned: [], notes: '', example: true });
        const records = {};
        Object.keys(p[5]).forEach(k => {
          const exp = V[k] ? addDays(T, p[5][k]) : '';
          records['r_ex' + (n++)] = { courseId: 'ex_' + k, status: 'completed', completedOn: V[k] ? addMonths(exp, -V[k]) : addDays(T, p[5][k]), scheduledFor: '', expiresOn: exp, certNo: 'EX-' + (1000 + n * 7), notes: '' };
        });
        Object.keys(p[6]).forEach(k => { records['r_ex' + (n++)] = { courseId: 'ex_' + k, status: p[6][k][0], completedOn: '', scheduledFor: addDays(T, p[6][k][1]), expiresOn: '', certNo: '', notes: '' }; });

        ['First aid refresher intake', 'training', 'ex_firstaid', { scope: 'date', date: addDays(T, 40) }, 'All staff', 'planned'],

  }
  async function removeExamples() {
    try {
      for (const s of state.staff.filter(x => x.example)) { await state.db.doc('training/' + s.id).delete(); await state.db.doc('staff/' + s.id).delete(); }
      for (const c of state.courses.filter(x => x.example)) await state.db.doc('courses/' + c.id).delete();
      for (const q of state.plans.filter(x => x.example)) await state.db.doc('plans/' + q.id).delete();
      toast('Example data removed.');
    } catch (e) { toast('Could not remove the examples. Try again.'); }
  }

  /* ---------- boot ---------- */
  async function safeUse(name) {
    try { if (!window.claude || typeof window.claude.use !== 'function') return null; return await window.claude.use(name); } catch (e) { return null; }
  }
  async function init() {
    render();
    const res = await Promise.all([safeUse('db'), safeUse('user'), safeUse('downloads'), safeUse('assets')]);
    const db = res[0], user = res[1];
    state.dl = res[2]; state.assets = res[3]; state.userNs = user;
    if (user) {
      try {
        state.me.id = await user.id();
        const me = await user.me();
        state.me.name = me.name || '';
        state.me.admin = await user.canEdit();
        state.me.canWrite = await user.can('data.write');
      } catch (e) { /* stays anonymous */ }
    }
    if (!db) { state.dbAvailable = false; render(); return; }
    state.db = db; state.dbAvailable = true;
    const fail = () => { state.error = 'Live updates stopped. Reload the page to reconnect.'; scheduleRender(); };
    db.collection('staff').onSnapshot(snap => { state.staff = snap.docs.map(d => cleanStaff(d.id, d.data())).filter(Boolean); state.loaded.staff = true; scheduleRender(); }, fail);
    db.collection('courses').onSnapshot(snap => { state.courses = snap.docs.map(d => cleanCourse(d.id, d.data())).filter(Boolean); state.loaded.courses = true; scheduleRender(); }, fail);
    db.collection('training').onSnapshot(snap => { state.training = new Map(snap.docs.map(d => [d.id, cleanTraining(d.id, d.data())])); state.loaded.training = true; scheduleRender(); }, fail);
    db.collection('plans').onSnapshot(snap => { state.plans = snap.docs.map(d => cleanPlan(d.id, d.data())).filter(Boolean); state.loaded.plans = true; scheduleRender(); }, fail);
    render();
  }
  init();
})();
</script>
